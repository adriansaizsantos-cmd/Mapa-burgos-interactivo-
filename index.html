<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mapa de Escudos de Burgos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body,#map{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #map{background:#e8e4dc}
  .panel{
    position:absolute;z-index:1000;top:10px;left:10px;right:10px;
    background:rgba(255,255,255,.96);border-radius:14px;padding:10px;
    box-shadow:0 3px 18px rgba(0,0,0,.18)
  }
  .row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
  .row:last-child{margin-bottom:0}
  input[type=text]{flex:1;min-width:0;padding:10px;border:1px solid #ccc;border-radius:9px;font-size:15px}
  button,label.btn{
    border:0;border-radius:9px;padding:10px 12px;background:#222;color:white;
    font-size:14px;cursor:pointer;white-space:nowrap
  }
  label.btn{display:inline-block}
  button.secondary{background:#e9e9e9;color:#222}
  #status{font-size:12px;color:#555;padding:2px 2px 0}
  .shield-icon img{
    width:var(--s);height:var(--s);object-fit:contain;
    display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));
    pointer-events:none
  }
  .shield-icon{background:transparent;border:0}
  .leaflet-control-zoom{margin-top:145px!important}
  .tip{
    position:absolute;z-index:1001;bottom:15px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.75);color:white;padding:8px 12px;border-radius:10px;
    font-size:12px;pointer-events:none;max-width:90%;text-align:center
  }
  .popup img{max-width:180px;max-height:180px;object-fit:contain}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="row">
    <input id="search" type="text" placeholder="Busca un pueblo de Burgos…">
    <button id="go">Buscar</button>
  </div>
  <div class="row">
    <label class="btn" for="file">🛡️ Añadir escudo</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="cancel" class="secondary">Cancelar</button>
    <button id="clear" class="secondary">Borrar todo</button>
  </div>
  <div id="status">Pulsa «Añadir escudo», elige una foto y después toca el mapa para colocarla.</div>
</div>
<div class="tip">Haz zoom con dos dedos y arrastra el mapa como en Google Maps.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', {zoomControl:true, minZoom:8, maxZoom:19})
  .setView([42.34,-3.70], 9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'© OpenStreetMap contributors'
}).addTo(map);

const status = document.getElementById('status');
const fileInput = document.getElementById('file');
let pendingImage = null;
let markers = [];

function setStatus(t){status.textContent=t}

function makeIcon(src, zoom){
  // The shield gets smaller when zooming out and larger when zooming in,
  // while staying readable. Base size is deliberately modest.
  const size = Math.max(18, Math.min(110, 24 * Math.pow(1.16, zoom-10)));
  return L.divIcon({
    className:'shield-icon',
    html:`<img src="${src}" style="--s:${size}px">`,
    iconSize:[size,size],
    iconAnchor:[size/2,size/2],
    popupAnchor:[0,-size/2]
  });
}

function refreshIcons(){
  const z=map.getZoom();
  markers.forEach(m=>m.setIcon(makeIcon(m._shieldSrc,z)));
}
map.on('zoomend',refreshIcons);

fileInput.addEventListener('change', e=>{
  const f=e.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    pendingImage=reader.result;
    setStatus('Foto preparada. Ahora toca el mapa donde está el pueblo.');
  };
  reader.readAsDataURL(f);
});

document.getElementById('cancel').onclick=()=>{
  pendingImage=null; fileInput.value=''; setStatus('Listo. Pulsa «Añadir escudo» para colocar otro.');
};

map.on('click', e=>{
  if(!pendingImage)return;
  const name=prompt('Nombre del pueblo (opcional):')||'Escudo';
  const m=L.marker(e.latlng,{icon:makeIcon(pendingImage,map.getZoom())}).addTo(map);
  m._shieldSrc=pendingImage;
  m.bindPopup(`<div class="popup"><b>${escapeHtml(name)}</b><br><img src="${pendingImage}"><br><button onclick="this.closest('.leaflet-popup').querySelector('.leaflet-popup-close-button').click();deleteMarker(${markers.length})">Eliminar</button></div>`);
  markers.push(m);
  pendingImage=null; fileInput.value='';
  setStatus('Escudo colocado. Puedes mover el mapa, hacer zoom y añadir otro.');
  save();
});

function deleteMarker(i){
  const m=markers[i];
  if(m){map.removeLayer(m);markers.splice(i,1);save();}
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function searchPlace(){
  const q=document.getElementById('search').value.trim();
  if(!q)return;
  setStatus('Buscando…');
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=es&q='+
      encodeURIComponent(q+', Burgos, España');
    const r=await fetch(url,{headers:{'Accept-Language':'es'}});
    const data=await r.json();
    if(!data.length){setStatus('No he encontrado ese sitio. Prueba con el nombre completo.');return;}
    const p=data[0];
    map.setView([+p.lat,+p.lon],15);
    setStatus('Encontrado. Ahora puedes colocar el escudo aquí.');
  }catch(e){setStatus('No se pudo buscar. Comprueba tu conexión.');}
}
document.getElementById('go').onclick=searchPlace;
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});

function save(){
  // Small demo persistence: store positions and image data in IndexedDB.
  // This keeps the map when the page is reopened on the same device.
  const req=indexedDB.open('escudos-burgos',1);
  req.onupgradeneeded=()=>req.result.createObjectStore('markers',{keyPath:'id',autoIncrement:true});
  req.onsuccess=()=>{
    const db=req.result, tx=db.transaction('markers','readwrite'), st=tx.objectStore('markers');
    st.clear();
    markers.forEach((m,i)=>st.add({lat:m.getLatLng().lat,lng:m.getLatLng().lng,src:m._shieldSrc}));
  };
}
function load(){
  const req=indexedDB.open('escudos-burgos',1);
  req.onupgradeneeded=()=>req.result.createObjectStore('markers',{keyPath:'id',autoIncrement:true});
  req.onsuccess=()=>{
    const db=req.result, tx=db.transaction('markers','readonly'), st=tx.objectStore('markers');
    st.getAll().onsuccess=e=>{
      (e.target.result||[]).forEach(x=>{
        const m=L.marker([x.lat,x.lng],{icon:makeIcon(x.src,map.getZoom())}).addTo(map);
        m._shieldSrc=x.src;
        m.bindPopup('<div class="popup"><img src="'+x.src+'"></div>');
        markers.push(m);
      });
    };
  };
}
document.getElementById('clear').onclick=()=>{
  if(!confirm('¿Borrar todos los escudos de este dispositivo?'))return;
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  const req=indexedDB.open('escudos-burgos',1);
  req.onsuccess=()=>{const db=req.result;db.transaction('markers','readwrite').objectStore('markers').clear();};
  setStatus('Mapa vacío. Puedes empezar de nuevo.');
};
load();
</script>
</body>
</html>
