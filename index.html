<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mapa de Escudos de Burgos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0} body{font-family:system-ui,sans-serif;overflow:hidden}
#map{background:#f5f3ee}
.panel{position:fixed;z-index:1000;top:10px;left:10px;right:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.panel>*{background:white;border:1px solid #bbb;border-radius:10px;padding:9px 11px;box-shadow:0 2px 8px #0002}
#search{flex:1;min-width:150px}
button{cursor:pointer}
#size{width:120px;padding:0;box-shadow:none;border:0}
#info{position:fixed;z-index:1000;bottom:10px;left:10px;background:#fffc;padding:7px 10px;border-radius:9px;font-size:12px}
.town-label{background:transparent;border:0;color:#222;font-weight:600;font-size:12px;text-shadow:0 1px 3px white,1px 0 2px white,-1px 0 2px white;white-space:nowrap}
.shield-icon{background:transparent;border:0;display:flex;align-items:flex-end;justify-content:center}
.shield-icon img{display:block;object-fit:contain;filter:drop-shadow(0 1px 2px #0005);border-radius:3px}
.leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <input id="search" placeholder="Buscar pueblo de Burgos…">
  <button id="smaller">−</button>
  <input id="size" type="range" min="28" max="180" value="70">
  <button id="larger">+</button>
  <button id="add">🛡️ Añadir escudo</button>
</div>
<div id="info">Toca un pueblo para colocar su escudo. El tamaño se puede cambiar con la barra.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BOUNDS = L.latLngBounds([[41.43,-4.30],[43.25,-2.75]]);
const map = L.map('map',{
  zoomControl:true,
  minZoom:8,
  maxZoom:22,
  maxBounds:BOUNDS.pad(0.03),
  maxBoundsViscosity:1,
  zoomSnap:0,
  zoomDelta:0.25,
  wheelPxPerZoomLevel:90,
  zoomAnimation:true,
  fadeAnimation:true,
  markerZoomAnimation:true
}).setView([42.35,-3.55],9);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{
  subdomains:'abcd',maxZoom:20,maxNativeZoom:20,
  attribution:'© OpenStreetMap © CARTO'
}).addTo(map);

// Nombres y geometrías de municipios: solo se dibujan nuestros nombres.
// La base CARTO usada arriba no muestra nombres de calles, negocios ni otras etiquetas.
const MUNICIPIOS_URL='https://raw.githubusercontent.com/inigoflores/ds-codigos-postales/master/data/BURGOS.geojson';

let towns=[], townLayer, selectedTown=null, pendingAdd=false, size=70;
const dbReq=indexedDB.open('escudos-burgos-v4',1);
let db;
dbReq.onupgradeneeded=e=>e.target.result.createObjectStore('escudos',{keyPath:'id'});
dbReq.onsuccess=e=>{db=e.target.result; loadSaved();};

function centerOf(feature){
  const pts=[];
  function walk(x){if(typeof x[0]==='number')pts.push(x);else x.forEach(walk)}
  walk(feature.geometry.coordinates);
  let sx=0,sy=0; pts.forEach(p=>{sx+=p[0];sy+=p[1]});
  return [sy/pts.length,sx/pts.length];
}

fetch(MUNICIPIOS_URL).then(r=>r.json()).then(g=>{
  // Este fichero contiene recintos postales asociados a códigos INE.
  // Agrupamos por código INE para obtener un único punto por municipio.
  const groups=new Map();
  for(const f of g.features){
    const id=String(f.properties.CODIGO_INE||'');
    if(!id) continue;
    if(!groups.has(id)) groups.set(id,{id,name:null,features:[]});
    groups.get(id).features.push(f);
  }
  // Nombres actualizados de municipios de Burgos desde una fuente pública.
  return Promise.all([...groups.values()].map(async x=>{
    try{
      const q=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+centerOf(x.features[0])[0]+'&lon='+centerOf(x.features[0])[1]+'&zoom=10&accept-language=es');
      const d=await q.json();
      x.name=d.address?.municipality||d.address?.town||d.address?.village||d.address?.county||('Municipio '+x.id);
    }catch(e){x.name='Municipio '+x.id}
    const c=x.features.map(centerOf).reduce((a,p)=>[a[0]+p[0],a[1]+p[1]],[0,0]);
    c[0]/=x.features.length;c[1]/=x.features.length;
    return {id:x.id,name:x.name,lat:c[0],lon:c[1]};
  }));
}).then(arr=>{
  towns=arr.filter(x=>x.lat>41.4&&x.lat<43.3&&x.lon>-4.4&&x.lon<-2.7);
  towns.sort((a,b)=>a.name.localeCompare(b.name,'es'));
  townLayer=L.layerGroup().addTo(map);
  towns.forEach(t=>{
    const m=L.marker([t.lat,t.lon],{icon:L.divIcon({className:'town-label',html:t.name,iconSize:null,iconAnchor:[0,0]})}).addTo(townLayer);
    m.on('click',()=>selectTown(t));
  });
  document.getElementById('info').textContent=`${towns.length} municipios cargados. Toca un nombre para seleccionar.`;
}).catch(()=>{
  document.getElementById('info').textContent='No se pudieron cargar los nombres. Comprueba la conexión a Internet.';
});

function selectTown(t){
  selectedTown=t;
  map.flyTo([t.lat,t.lon],Math.max(map.getZoom(),15),{duration:.6});
  pendingAdd=true;
  document.getElementById('info').textContent=`${t.name}: pulsa “Añadir escudo” para elegir la imagen.`;
}
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLocaleLowerCase('es');
  if(!q)return;
  const t=towns.find(x=>x.name.toLocaleLowerCase('es').includes(q));
  if(t) map.setView([t.lat,t.lon],Math.max(map.getZoom(),13),{animate:true});
});

document.getElementById('size').addEventListener('input',e=>{size=+e.target.value; refreshShieldSizes();});
document.getElementById('smaller').onclick=()=>{size=Math.max(28,size-10);document.getElementById('size').value=size;refreshShieldSizes()};
document.getElementById('larger').onclick=()=>{size=Math.min(180,size+10);document.getElementById('size').value=size;refreshShieldSizes()};

let saved=new Map();
function tx(mode='readonly'){return db.transaction('escudos',mode).objectStore('escudos')}
function loadSaved(){
  if(!db)return;
  tx().getAll().onsuccess=e=>{
    saved=new Map(e.target.result.map(x=>[x.id,x]));
    renderSaved();
  };
}
function renderSaved(){
  saved.forEach(s=>{
    if(s.marker) s.marker.remove();
    const icon=L.divIcon({className:'shield-icon',iconSize:[s.size,s.size],iconAnchor:[s.size/2,s.size],html:`<img src="${s.img}" width="${s.size}" height="${s.size}">`});
    s.marker=L.marker([s.lat,s.lon],{icon,draggable:true}).addTo(map);
    s.marker.bindTooltip(s.name,{direction:'top',offset:[0,-s.size]});
    s.marker.on('dragend',()=>{
      const p=s.marker.getLatLng();s.lat=p.lat;s.lon=p.lng;
      tx('readwrite').put({...s,marker:undefined});
    });
    s.marker.on('click',()=>{selectedTown=towns.find(t=>t.id===s.id)||selectedTown;s.marker.openTooltip();});
  });
}
function refreshShieldSizes(){
  saved.forEach(s=>{
    s.size=size;
    if(s.marker){s.marker.setIcon(L.divIcon({className:'shield-icon',iconSize:[size,size],iconAnchor:[size/2,size],html:`<img src="${s.img}" width="${size}" height="${size}">`}));}
    tx('readwrite').put({...s,marker:undefined});
  });
}
document.getElementById('add').onclick=()=>{
  if(!selectedTown){alert('Primero toca el nombre de un pueblo.');return}
  const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp';input.click();
  input.onchange=async()=>{
    const f=input.files[0];if(!f)return;
    const img=await compress(f);
    const s={id:selectedTown.id,name:selectedTown.name,lat:selectedTown.lat,lon:selectedTown.lon,img,size};
    tx('readwrite').put(s).onsuccess=()=>{saved.set(s.id,s);renderSaved();document.getElementById('info').textContent=`Escudo guardado: ${s.name}`};
  };
};
function compress(file){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=600,scale=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        resolve(c.toDataURL('image/webp',.88));
      };im.src=r.result;
    };r.readAsDataURL(file);
  });
}
</script>
</body>
</html>
